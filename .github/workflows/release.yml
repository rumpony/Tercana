name: Release

# Tag a version (git tag v2.1.0 && git push --tags) to publish a downloadable build.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: sudo xcode-select -s /Applications/Xcode.app
      - run: brew install xcodegen && xcodegen generate
      - name: Build
        run: |
          set -o pipefail
          xcodebuild build -project Tercana.xcodeproj -scheme Tercana -configuration Release \
            -destination 'generic/platform=macOS' -derivedDataPath build \
            MARKETING_VERSION="${GITHUB_REF_NAME#v}" CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            | tail -5
      # Ad-hoc signature: runs on any Mac after right-click → Open. Notarization needs a paid Apple Developer ID.
      - run: codesign --force --deep --sign - --entitlements Resources/Tercana.entitlements build/Build/Products/Release/Tercana.app
      - run: ditto -c -k --keepParent build/Build/Products/Release/Tercana.app Tercana.zip
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" Tercana.zip --clobber || gh release create "$GITHUB_REF_NAME" Tercana.zip --title "Tercana $GITHUB_REF_NAME" --generate-notes
