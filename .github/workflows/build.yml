name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: Generate project
        run: brew install xcodegen && xcodegen generate
      - name: Build
        run: |
          set -o pipefail
          xcodebuild build -project SubLens.xcodeproj -scheme SubLens -configuration Release \
            -destination 'generic/platform=macOS' -derivedDataPath build \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build.log | grep -E "error:|warning: .*(deprecated|unused)|\*\* BUILD" || true
          grep -q "\*\* BUILD SUCCEEDED \*\*" build.log
      - name: Package
        run: ditto -c -k --keepParent build/Build/Products/Release/SubLens.app SubLens.zip
      - uses: actions/upload-artifact@v4
        with:
          name: SubLens
          path: SubLens.zip
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: build.log
