name: SubLens
options:
  bundleIdPrefix: com.rumpony
  deploymentTarget:
    macOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: NO
targets:
  SubLens:
    type: application
    platform: macOS
    sources:
      - Sources
      - Resources/Assets.xcassets
      - path: Resources
        includes:
          - "*.lproj/**"
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rumpony.SubLens
        PRODUCT_NAME: SubLens
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/SubLens.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
