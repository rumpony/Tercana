name: Tercana
options:
  bundleIdPrefix: com.rumpony
  deploymentTarget:
    macOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: NO
targets:
  Tercana:
    type: application
    platform: macOS
    sources:
      - Sources
      - Resources/Assets.xcassets
      # The trophy screens are shared with the iPhone app.
      - path: iOS/Sources
        excludes: [TercanaMobileApp.swift, SignInView.swift, Notifier.swift, WidgetData.swift]
      - path: Resources
        includes:
          - "*.lproj/**"
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rumpony.Tercana
        PRODUCT_NAME: Tercana
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/Tercana.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
